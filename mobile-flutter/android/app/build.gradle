plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

/*
  The key a release is signed with, from android/key.properties - kept out of
  git, like the keystore it names. Without it the release is signed with the
  debug key, which installs for testing and cannot be published or updated
  from; the build says so rather than letting it pass unnoticed.
*/
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
} else {
    logger.warn('android/key.properties not found: release builds are signed with the debug key.')
}

android {
    namespace 'com.example.productivity_platform'
    compileSdkVersion flutter.compileSdkVersion
    buildToolsVersion '36.1.0'
    ndkVersion flutter.ndkVersion

    // AGP 9 turns per-flavor resource values off by default; the flavors
    // give each build its own app name with one.
    buildFeatures {
        resValues true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.productivity_platform"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Productivity Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "Productivity Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Productivity Platform"
        }
    }
}

// Kotlin is compiled by AGP itself now; its bytecode target has to match
// Java's, which compileOptions sets to 17.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.multidex:multidex:2.0.1'
    // WorkManager was listed here though nothing in the app schedules work.
    // In a shrunk release build it crashed the app on launch: R8 removed the
    // database class its start-up initialiser creates by reflection.
}

