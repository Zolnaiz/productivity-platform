org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# The project sits on D: and the pub cache on C:, and Kotlin 2.3's incremental
# caches cannot relate files across drives on Windows; without incremental
# compilation the build is slower and succeeds.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

# The QR scanner uses the barcode model Google Play services already holds,
# rather than shipping a copy in the app (about 16 MB).
dev.steenbakker.mobile_scanner.useUnbundled=true
