name: productivity_mobile
description: Productivity Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.1

  # Networking
  dio: ^5.3.3
  connectivity_plus: ^7.1.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1

  # Environment
  flutter_dotenv: ^6.0.1

  # UI Components
  google_fonts: ^8.1.0

  # Navigation
  go_router: ^17.0.0

  # Icons
  cupertino_icons: ^1.0.6

  # Notifications
  flutter_local_notifications: ^22.0.1
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env.example
