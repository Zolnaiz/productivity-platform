name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint:check

      # Every migration applied to a real PostgreSQL compiled to WebAssembly,
      # then the schema checked against what the entities say. Schema drift is
      # the one class of fault this repository has shipped twice — tables that
      # existed in the entities and in nobody's database — and it cannot fail
      # a unit test.
      - name: Migrations
        run: npm run migration:check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- run

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

  # Every serious defect found in this application in the last month was found
  # by opening it: walls that were never saved, pointer coordinates that
  # ignored the canvas's letterboxing, a plan drawn white on a dark page. None
  # of them could fail a unit test, because jsdom has no layout. This job is
  # the cheapest thing that would have caught them.
  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Demo mode: the fixtures live in the browser, so this needs no server
      # and no database. What it exercises is the shell, the router, the
      # canvas and the theme.
      - name: Smoke
        run: npm run test:e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin-web/playwright-report
          retention-days: 7

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The live-server test skips itself without API_BASE_URL; the job
      # below runs it against a real server.
      - name: Test
        run: flutter test

      # The Android release build, shrunk as it would be shipped. It had never
      # been built until it was, and then it stopped on missing resources and,
      # once built, crashed on launch - none of which analyze or the tests see.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the Android release
        run: flutter build apk --release --flavor production --dart-define=API_BASE_URL=https://example.invalid/api

  # The whole stack against a real PostgreSQL: migrations, seed, the built
  # server, then every page's first request and the mobile client's own calls.
  # The notification inbox and the departments page once answered every
  # request with a 500 on a real database while every unit test passed,
  # because the unit tests mock the database. This is the job that sees that.
  live-api:
    name: Live API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: productivity
          POSTGRES_PASSWORD: productivity-ci
          POSTGRES_DB: productivity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U productivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: productivity
      DB_PASSWORD: productivity-ci
      DB_DATABASE: productivity_ci
      JWT_SECRET: ci-only-secret-that-signs-nothing-real
      ENABLE_AUDIT_SCHEDULER: 'false'
      ENABLE_MONTH_CLOSE: 'false'
      ENABLE_DAILY_REMINDERS: 'false'
      # One browser walking every page, after the smoke has saved one of
      # everything, asks for more than the 120 a minute a real client gets;
      # the suite then fails on 429s, not on anything it checks.
      RATE_LIMIT_LIMIT: '5000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, migrate and seed
        working-directory: backend
        run: |
          npm ci
          npm run migration:run
          npm run seed
          npm run build

      - name: Start the server
        working-directory: backend
        run: |
          nohup node dist/main > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      # SMOKE_WRITES saves one of everything people save, which is right on
      # this throwaway database and never on a live one.
      - name: Smoke every page and every write against the real database
        working-directory: backend
        env:
          SMOKE_WRITES: 'true'
        run: npm run smoke:api

      # The web's saves read back from the real server: a save that never
      # leaves the browser, or that the API refuses, looks fine in demo mode.
      - name: Browser against the real server
        working-directory: admin-web
        env:
          E2E_LIVE_API: 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/live-api.spec.ts e2e/operator.spec.ts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Mobile client against the real server
        working-directory: mobile-flutter
        run: |
          flutter pub get
          flutter test test/phase_one_live_backend_test.dart --dart-define=API_BASE_URL=http://127.0.0.1:3000/api

      - name: Server log on failure
        if: failure()
        working-directory: backend
        run: cat server.log || true

  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate default production compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config > /dev/null

      - name: Validate cache production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile cache config > /dev/null

      - name: Validate backup production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile backup config > /dev/null

      - name: Validate monitoring production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile monitoring config > /dev/null
