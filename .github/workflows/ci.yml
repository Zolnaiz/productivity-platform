name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint:check

      # Every migration applied to a real PostgreSQL compiled to WebAssembly,
      # then the schema checked against what the entities say. Schema drift is
      # the one class of fault this repository has shipped twice — tables that
      # existed in the entities and in nobody's database — and it cannot fail
      # a unit test.
      - name: Migrations
        run: npm run migration:check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- run

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

  # Every serious defect found in this application in the last month was found
  # by opening it: walls that were never saved, pointer coordinates that
  # ignored the canvas's letterboxing, a plan drawn white on a dark page. None
  # of them could fail a unit test, because jsdom has no layout. This job is
  # the cheapest thing that would have caught them.
  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Demo mode: the fixtures live in the browser, so this needs no server
      # and no database. What it exercises is the shell, the router, the
      # canvas and the theme.
      - name: Smoke
        run: npm run test:e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin-web/playwright-report
          retention-days: 7

  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate default production compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config > /dev/null

      - name: Validate cache production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile cache config > /dev/null

      - name: Validate backup production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile backup config > /dev/null

      - name: Validate monitoring production profile
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile monitoring config > /dev/null
