server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Must come before the SPA fallback below, which otherwise answers /api with
  # index.html and a 200. That is worse than a 404: the browser gets HTML where
  # it expected JSON, and every call fails as a parse error somewhere far from
  # the cause. The Vite dev server proxies /api the same way, so a deployment
  # served from one origin behaves in production as it did in development and
  # needs no CORS grant at all.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The backend allows a 12MB attachment; nginx's default 1m would reject a
    # photograph long before it got there, with a 413 the application never
    # sees and cannot explain. Sitting just above the real limit keeps the
    # backend's own message as the one the user is shown.
    client_max_body_size 16m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
