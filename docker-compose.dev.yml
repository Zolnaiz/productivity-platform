# Development override for docker-compose.yml: the API runs from source with reload.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    environment:
      NODE_ENV: development
      DB_SYNCHRONIZE: "true"
      DB_MIGRATIONS_RUN: "false"
      DB_LOGGING: "true"
      ENABLE_SWAGGER: "true"
      ALLOW_PUBLIC_OPERATIONS: "true"
